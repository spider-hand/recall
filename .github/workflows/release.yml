name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          mkdir -p dist

          GOOS=darwin GOARCH=amd64 go build -ldflags="-X main.version=$VERSION" -o dist/recall_darwin_amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-X main.version=$VERSION" -o dist/recall_darwin_arm64 .
          GOOS=linux GOARCH=amd64 go build -ldflags="-X main.version=$VERSION" -o dist/recall_linux_amd64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-X main.version=$VERSION" -o dist/recall_windows_amd64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*